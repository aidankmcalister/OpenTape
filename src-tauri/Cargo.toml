[package]
name = "screen-recorder"
version = "0.1.0"
description = "A small, free, open-source screen recorder for macOS."
authors = ["Aidan McAlister"]
license = "MIT"
repository = "https://github.com/aidankmcalister/screen-recorder"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screen_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cidre = { version = "=0.29.0", default-features = false, features = ["sc", "av", "async", "blocks", "macos_15_0"] }
anyhow = "=1.0.104"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "libc", "NSApplication", "NSView", "NSVisualEffectView", "NSAnimation", "NSAnimationContext", "objc2-quartz-core", "NSPanel", "NSScreen", "NSEvent", "NSPasteboard", "NSCursor"] }
objc2 = { version = "=0.6.5", features = ["exception"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSURL", "NSArray", "NSString", "NSError", "NSValue", "NSFileManager"] }
base64 = "=0.22.1"
tauri-plugin-global-shortcut = "=2.4.1"
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMediaTimingFunction", "objc2-core-foundation"] }
tauri-plugin-dialog = "=2.8.3"
ts-rs = "12.0.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-image", "objc2-core-media", "objc2-core-graphics", "AVAsset", "AVAssetImageGenerator", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVAudioMix", "AVAudioProcessingSettings", "AVComposition", "AVMediaFormat", "AVVideoComposition", "AVVideoCompositing", "AVVideoSettings"] }
objc2-core-image = { version = "=0.3.2", default-features = false, features = ["std", "CIImage", "CIContext", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-video"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGGradient", "CGImage", "CGPath"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
block2 = "=0.6.2"
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMFormatDescription", "CMTime", "CMTimeRange", "CMSampleBuffer", "objc2-core-audio-types", "objc2-core-video"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-log = "=2.10.1"
log = "=0.4.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
