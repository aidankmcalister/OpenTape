# Weekly update proposals, grouped so each ecosystem is one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
