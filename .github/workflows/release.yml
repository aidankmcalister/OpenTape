# Pushing a version tag (v0.1.0) builds a signed, notarized OpenTape.dmg
# for Apple silicon, plus the signed updater archive and latest.json, and
# attaches them to a draft release. Publish it by hand.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-26 # arm64
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Tauri imports the certificate into a temporary keychain, signs with it,
      # then notarizes and staples the .app.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Signs the updater archive that installed copies download and verify.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Lays out the DMG window, which Tauri skips when CI is set.
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tag matches the app version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          case "$GITHUB_REF_NAME" in
            "v$VERSION" | "v$VERSION"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION"; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-about

      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked # `bun run notices` runs cargo about with --frozen
        working-directory: src-tauri

      # Updater archives need the private key, so only release builds make them.
      - run: bun tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Tauri signs the .dmg but doesn't notarize it, and Apple wants the
      # outermost container notarized.
      - name: Notarize and staple the .dmg
        run: |
          APP=src-tauri/target/release/bundle/macos/OpenTape.app
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t exec "$APP"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          mv "$DMG" OpenTape.dmg

      # Installed copies check releases/latest/download/latest.json.
      - name: Write latest.json for the updater
        run: |
          TAR=src-tauri/target/release/bundle/macos/OpenTape.app.tar.gz
          cp "$TAR" OpenTape.app.tar.gz
          jq -n \
            --arg version "$(jq -r .version src-tauri/tauri.conf.json)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$TAR.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/OpenTape.app.tar.gz" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > latest.json

      # The website links to releases/latest/download/OpenTape.dmg.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenTape.dmg OpenTape.app.tar.gz latest.json --draft \
            --verify-tag --title "OpenTape $GITHUB_REF_NAME" --generate-notes
