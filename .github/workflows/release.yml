# Pushing a version tag (v0.1.0) builds a signed, notarized OpenTape.dmg
# for Apple silicon and attaches it to a draft release. Publish it by hand.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-26 # arm64
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Tauri imports the certificate into a temporary keychain, signs with it,
      # then notarizes and staples the .app.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tag matches the app version
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          case "$GITHUB_REF_NAME" in
            "v$VERSION" | "v$VERSION"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION"; exit 1 ;;
          esac

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-about

      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked # `bun run notices` runs cargo about with --frozen
        working-directory: src-tauri

      - run: bun tauri build --bundles app,dmg

      # Tauri signs the .dmg but doesn't notarize it, and Apple wants the
      # outermost container notarized.
      - name: Notarize and staple the .dmg
        run: |
          APP=src-tauri/target/release/bundle/macos/OpenTape.app
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          spctl -a -vv -t exec "$APP"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          mv "$DMG" OpenTape.dmg

      # The website links to releases/latest/download/OpenTape.dmg.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenTape.dmg --draft \
            --verify-tag --title "OpenTape $GITHUB_REF_NAME" --generate-notes
