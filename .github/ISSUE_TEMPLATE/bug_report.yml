name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose Window on the record bar
        2. Pick a window in full screen
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0, or the commit you built from
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the end of the app's log, `~/Library/Logs/com.aidankmcalister.opentape/OpenTape.log` (in Finder, choose Go > Go to Folder and paste the path), and add a screenshot if it helps. The log holds only warnings, errors and crashes, and the app never sends it anywhere.
