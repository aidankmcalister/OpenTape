name: Idea or feature
description: Suggest something new, or a change to how something works.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Screenshots of other apps help.
